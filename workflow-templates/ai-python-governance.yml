name: AI Python Governance CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-quality:
    if: github.event_name == 'pull_request'
    uses: office138-org/ci-standards/.github/workflows/pr-gate.yml@v1
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      python_version: "3.12"
      requirements_file: requirements-dev.txt
      cache_dependency_paths: |
        requirements.txt
        requirements-dev.txt
      typecheck_roots: "src tools app"
      governance_tests: "tests/test_repository_bootstrap.py"
      critical_tests: "tests/test_smoke.py"

  post-merge:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: office138-org/ci-standards/.github/workflows/post-merge.yml@v1
    with:
      python_version: "3.12"
      requirements_file: requirements-dev.txt
      cache_dependency_paths: |
        requirements.txt
        requirements-dev.txt
      pytest_root: tests/
      xdist_workers: auto
      xdist_mode: worksteal
      require_pr_provenance: true
